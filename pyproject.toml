[project]
name = "automated-pipeline"
version = "0.0.0"
description = "ORCA -> Corvus/FEFF batch calculation pipeline (SLAC)"
requires-python = ">=3.12"
# Runtime deps the scripts import. numpy/matplotlib are used broadly; larch
# (xraylarch) is imported lazily inside script-process-feff-output for EXAFS
# xftf only. `corvus` is the domain package and is not pip-installable here, so
# it is intentionally not listed.
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
exafs = ["xraylarch"]

# Human-facing console commands. The internal machinery (generated compute-node
# scripts, orchestrator subprocesses) invokes `python -m xas_pipeline...` instead,
# so it needs only an importable package, not these on PATH.
[project.scripts]
xas-run-batch = "xas_pipeline.orchestrate:main"
xas-prepare-orca = "xas_pipeline.stages.orca_prep:main"
xas-prepare-corvus = "xas_pipeline.stages.corvus_prep:main"
xas-interp-hessian = "xas_pipeline.stages.interp_hessian:main"
xas-orca-check = "xas_pipeline.stages.orca_check:main"
xas-process-feff = "xas_pipeline.stages.feff_process:main"
xas-download = "xas_pipeline.stages.download:main"
xas-cleanup = "xas_pipeline.stages.cleanup:main"
xas-postprocess = "xas_pipeline.cli.postprocess:main"
xas-rerun-corvus = "xas_pipeline.cli.rerun_corvus:main"
xas-auto-rerun-corvus = "xas_pipeline.cli.auto_rerun_corvus:main"
xas-rerun-orca = "xas_pipeline.cli.rerun_orca:main"
xas-submit-corvus = "xas_pipeline.cli.submit_corvus:main"
xas-count-imag-freq = "xas_pipeline.stages.count_imag_freq:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ layout: the importable package is src/xas_pipeline. During the reorg the
# top-level hyphen scripts remain the working entry points and delegate into the
# package; console_scripts are wired once cli/ adapters exist.
[tool.hatch.build.targets.wheel]
packages = ["src/xas_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
