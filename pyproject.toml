[project]
name = "automated-pipeline"
version = "0.0.0"
description = "ORCA -> Corvus/FEFF batch calculation pipeline (SLAC)"
requires-python = ">=3.12"
# Runtime deps the scripts import. numpy/matplotlib are used broadly; larch
# (xraylarch) is imported lazily inside script-process-feff-output for EXAFS
# xftf only. `corvus` is the domain package and is not pip-installable here, so
# it is intentionally not listed.
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
exafs = ["xraylarch"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ layout: the importable package is src/xas_pipeline. During the reorg the
# top-level hyphen scripts remain the working entry points and delegate into the
# package; console_scripts are wired once cli/ adapters exist.
[tool.hatch.build.targets.wheel]
packages = ["src/xas_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
