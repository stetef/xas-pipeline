[project]
name = "xas-pipeline"
dynamic = ["version"]
description = "ORCA -> CORVUS/FEFF batch pipeline for XANES/EXAFS spectra (SLAC)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samantha Tetef" }]
requires-python = ">=3.12"
# corvus (needed on the compute nodes) is not pip-installable and is not listed.
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
# chi(k) -> chi(R) in xas-process-feff.
exafs = ["xraylarch"]

# The generated job scripts call `python -m xas_pipeline...`, so they need only
# the importable package, not these on PATH.
[project.scripts]
xas-run-batch = "xas_pipeline.orchestrate:main"
xas-prepare-orca = "xas_pipeline.stages.orca_prep:main"
xas-prepare-corvus = "xas_pipeline.stages.corvus_prep:main"
xas-interp-hessian = "xas_pipeline.stages.interp_hessian:main"
xas-build-interp = "xas_pipeline.cli.build_interp:main"
xas-orca-check = "xas_pipeline.stages.orca_check:main"
xas-process-feff = "xas_pipeline.stages.feff_process:main"
xas-download = "xas_pipeline.stages.download:main"
xas-cleanup = "xas_pipeline.stages.cleanup:main"
xas-postprocess = "xas_pipeline.cli.postprocess:main"
xas-rerun-corvus = "xas_pipeline.cli.rerun_corvus:main"
xas-auto-rerun-corvus = "xas_pipeline.cli.auto_rerun_corvus:main"
xas-rerun-orca = "xas_pipeline.cli.rerun_orca:main"
xas-watchdog = "xas_pipeline.cli.watchdog:main"
xas-submit-corvus = "xas_pipeline.cli.submit_corvus:main"
xas-count-imag-freq = "xas_pipeline.stages.count_imag_freq:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "xraylarch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/xas_pipeline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xas_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = ["slow: runs a full stage or batch end to end (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: wrapped by hand where it reads better
    "SIM105",  # try/except/pass reads as plainly as contextlib.suppress
    "UP042",   # StrEnum would change str() of the failure kinds written to logs
    "RUF001",  # ambiguous unicode in strings (Å, χ are intended)
    "RUF002",
    "RUF003",
]
